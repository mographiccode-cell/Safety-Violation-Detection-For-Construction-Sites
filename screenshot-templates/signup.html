<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Smart Workplace Safety</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#071421,#0b2235);color:#eef5f9;min-height:100vh;display:grid;place-items:center}.card{width:620px;max-width:94vw;background:#0d1b2a;border:1px solid #263b50;border-radius:24px;padding:34px;box-shadow:0 28px 80px #0007}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:14px;background:#159b68;display:grid;place-items:center;font-weight:900}.muted{color:#91a5b6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.input{width:100%;background:#071321;border:1px solid #28405a;color:white;border-radius:12px;padding:13px;font-size:15px}.btn{width:100%;border:0;border-radius:12px;background:#159b68;color:white;font-weight:800;padding:14px;margin-top:10px}.error-card{margin:16px auto;background:#b4232d;border:2px solid #ef5a64;color:white;font-weight:800;text-align:center;padding:15px;border-radius:12px}.success{background:#133d31;border:1px solid #2ca776;color:#c7f9e4;padding:12px;border-radius:12px;text-align:center;font-weight:700}.foot{text-align:center;margin-top:18px;color:#92a5b5}.foot a{color:#7fe0b8;font-weight:700}</style></head><body><form class="card" method="post"><div class="brand"><div class="logo">S</div><div><b>Smart Workplace Safety</b><div class="muted">Create supervisor account</div></div></div><h1>Create account</h1><p class="muted">Accounts are stored in the project SQLite database using secure password hashing.</p>{% if error %}<div id="signupError" class="error-card">{{ error }}</div>{% endif %}{% if success %}<div class="success">{{ success }}</div>{% endif %}<div class="grid"><div class="field full"><label>Full name</label><input class="input" name="full_name" required></div><div class="field full"><label>Username</label><input class="input" name="username" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" required></div><div class="field"><label>Confirm password</label><input class="input" type="password" name="confirm_password" required></div></div><button class="btn" type="submit">Create account</button><div class="foot">Already registered? <a href="/login">Back to login</a></div></form></body></html>
