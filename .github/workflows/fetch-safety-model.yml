name: Fetch Safety Model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch model from public GitHub repository
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/C-Nekopedia/SiteGuard.git source-repo
          mkdir -p model
          cp source-repo/data/models/yolo26n_ppe.pt model/yolo26n_ppe.pt
          ls -lh model/yolo26n_ppe.pt
          sha256sum model/yolo26n_ppe.pt | tee model/SHA256SUMS.txt
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolo26n-ppe-model
          path: model/
          if-no-files-found: error
          retention-days: 1
