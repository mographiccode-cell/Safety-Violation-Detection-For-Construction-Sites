name: Fetch Safety Model

on:
  push:
    branches: [main]
    paths:
      - model-fetch-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Fetch model from public GitHub repository
        run: |
          set -euxo pipefail
          rm -rf source-repo
          git clone --depth 1 https://github.com/C-Nekopedia/SiteGuard.git source-repo
          mkdir -p models
          cp source-repo/data/models/yolo26n_ppe.pt models/yolo26n_ppe.pt
          sha256sum models/yolo26n_ppe.pt | tee models/yolo26n_ppe.sha256
          ls -lh models/yolo26n_ppe.pt

      - name: Commit copied model into this project
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/yolo26n_ppe.pt models/yolo26n_ppe.sha256
          if git diff --cached --quiet; then
            echo "Model already present; nothing to commit."
          else
            git commit -m "chore: copy yolo26n PPE model from SiteGuard"
            git push
          fi

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolo26n-ppe-model
          path: |
            models/yolo26n_ppe.pt
            models/yolo26n_ppe.sha256
          if-no-files-found: error
          retention-days: 1
