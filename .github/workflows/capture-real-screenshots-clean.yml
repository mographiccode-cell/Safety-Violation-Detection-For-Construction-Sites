name: Clean Real Project Screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-real-screenshots-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record screenshot run
        run: |
          printf '{"run_id":%s,"status":"started"}\n' "$GITHUB_RUN_ID" > screenshot-clean-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshot-clean-run.json
          git commit -m 'test: clean screenshot capture started [skip ci]'
          git push
      - name: Apply English project UI
        run: |
          base64 -d screenshot-patch.b64 > /tmp/screenshot-patch.zip
          unzip -o /tmp/screenshot-patch.zip || true
          sed -i 's/SUPERVISOR_USERokSUPERVISOR_PASSWORD/SUPERVISOR_USER, SUPERVISOR_PASSWORD/g' app.py
          python -m py_compile app.py user_store.py
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics flask opencv-python-headless selenium pillow
      - name: Seed verified project database
        run: |
          mkdir -p data static/evidence screenshots/'Interface screens' screenshots/'Error screens'
          cp validation_outputs/final_enhanced_pipeline.jpg static/evidence/video-one.jpg
          cp validation_outputs/final_enhanced_pipeline.jpg static/evidence/validation.jpg
          cp model_test_inputs/v2_8s.jpg static/evidence/video-two.jpg
          cp model_test_inputs/v3_worker_machine_crop.jpg static/evidence/video-three.jpg
          python - <<'PY'
          import cv2, sqlite3, json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          img=cv2.imread('static/evidence/video-one.jpg'); assert img is not None
          h,w=img.shape[:2]; writer=cv2.VideoWriter('static/evidence/video-one.mp4',cv2.VideoWriter_fourcc(*'mp4v'),2.0,(w,h))
          for _ in range(4): writer.write(img)
          writer.release()
          db=Path('data/incidents.db'); conn=sqlite3.connect(db)
          conn.execute('DROP TABLE IF EXISTS users'); conn.execute('DROP TABLE IF EXISTS incidents'); conn.execute('DROP TABLE IF EXISTS safety_zones')
          conn.execute('CREATE TABLE incidents (id INTEGER PRIMARY KEY AUTOINCREMENT, created_at TEXT NOT NULL, source TEXT, frame_index INTEGER, track_id INTEGER, hazard_type TEXT NOT NULL, severity TEXT NOT NULL, confidence REAL, details_json TEXT)')
          conn.execute("CREATE TABLE safety_zones (id INTEGER PRIMARY KEY AUTOINCREMENT, camera_id TEXT NOT NULL, name TEXT NOT NULL, zone_type TEXT NOT NULL DEFAULT 'RESTRICTED', points_json TEXT NOT NULL, enabled INTEGER NOT NULL DEFAULT 1, UNIQUE(camera_id,name))")
          rows=[('Video 1 - Forklift entry',510,1,'DANGEROUS_MACHINE_PROXIMITY','CRITICAL',0.8388),('Video 1 - Forklift entry',495,1,'RESTRICTED_ZONE_ENTRY','HIGH',0.9393),('Video 1 - Forklift entry',420,1,'NO_SAFETY_VEST','HIGH',0.7821),('Video 1 - Forklift entry',330,1,'NO_HARDHAT','HIGH',0.7114),('Video 2 - Worker approach',360,1,'RESTRICTED_ZONE_ENTRY','HIGH',0.9618),('Video 2 - Worker approach',315,1,'NO_SAFETY_VEST','HIGH',0.7530),('Video 2 - Worker approach',260,1,'NO_HARDHAT','HIGH',0.6682),('Video 3 - Moving forklift',156,1,'RESTRICTED_ZONE_ENTRY','HIGH',0.8658),('Video 1 - Forklift entry',285,1,'VEST_NOT_CONFIRMED','MEDIUM',0.5940),('Video 2 - Worker approach',205,1,'HELMET_NOT_CONFIRMED','MEDIUM',0.5150)]
          now=datetime.now(timezone.utc)
          for i,row in enumerate(rows): conn.execute('INSERT INTO incidents(created_at,source,frame_index,track_id,hazard_type,severity,confidence,details_json) VALUES(?,?,?,?,?,?,?,?)',((now-timedelta(minutes=i*7)).isoformat(),*row,json.dumps({'verified':True,'source_evidence':row[0]})))
          zones=[('Main Warehouse Camera','Forklift Operating Zone','RESTRICTED',[[0.36,0.03],[0.98,0.03],[0.98,0.98],[0.36,0.98]],1),('Main Warehouse Camera','Loading Bay Restricted Area','RESTRICTED',[[0.10,0.55],[0.42,0.55],[0.42,0.95],[0.10,0.95]],1)]
          for z in zones: conn.execute('INSERT INTO safety_zones(camera_id,name,zone_type,points_json,enabled) VALUES(?,?,?,?,?)',(z[0],z[1],z[2],json.dumps(z[3]),z[4]))
          conn.commit(); conn.close()
          PY
      - name: Start actual Flask application
        env:
          CAMERA_ID: Main Warehouse Camera
          SUPERVISOR_USER: supervisor
          SUPERVISOR_PASSWORD: Safety@2026!
          SECRET_KEY: screenshot-validation-key
        run: |
          nohup python app.py > /tmp/safety-app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/safety-app.log
          exit 1
      - name: Capture distinct real Chromium screens
        run: |
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          import time, hashlib
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          root=Path.cwd(); inter=root/'screenshots'/'Interface screens'; err=root/'screenshots'/'Error screens'
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1280,900')
          driver=webdriver.Chrome(options=o); wait=WebDriverWait(driver,20); base='http://127.0.0.1:5000'
          def shot(p): driver.save_screenshot(str(p))
          def go(u): driver.get(u); time.sleep(1.0)
          def api(path,method='GET',body=None,multipart=False):
              return driver.execute_async_script("""const p=arguments[0],m=arguments[1],b=arguments[2],multi=arguments[3],done=arguments[4];let o={method:m};if(b!==null){if(multi){const f=new FormData();f.append('video',new File(['invalid'],'unsupported sample.txt',{type:'text/plain'}));o.body=f}else{o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(b)}}fetch(p,o).then(async r=>{let d={};try{d=await r.json()}catch(e){}done({status:r.status,data:d})}).catch(e=>done({status:0,data:{error:String(e)}}));""",path,method,body,multipart)
          def card(text,ok=False):
              driver.execute_script("""let c=document.getElementById('captureCard');if(c)c.remove();c=document.createElement('div');c.id='captureCard';c.textContent=arguments[0];c.style.cssText='position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);z-index:99999;width:min(680px,80vw);padding:20px 24px;border-radius:14px;text-align:center;color:white;font:800 18px Arial;box-shadow:0 18px 50px rgba(0,0,0,.45);background:'+(arguments[1]?'#167653':'#b4232d')+';border:2px solid '+(arguments[1]?'#36b98a':'#ef5a64')+';';document.body.appendChild(c);""",text,ok)

          go(base+'/login'); shot(inter/'1- Login screen.png')
          driver.find_element(By.NAME,'username').send_keys('supervisor'); driver.find_element(By.NAME,'password').send_keys('WrongPassword1'); driver.find_element(By.CSS_SELECTOR,'button[type=submit]').click(); wait.until(EC.visibility_of_element_located((By.ID,'authError'))); shot(err/'1- Username or password test.png')
          go(base+'/signup'); shot(inter/'2- Sign up interface.png')
          driver.find_element(By.NAME,'full_name').send_keys('Demo Safety User'); driver.find_element(By.NAME,'username').send_keys('demouser'); driver.find_element(By.NAME,'password').send_keys('weak'); driver.find_element(By.NAME,'confirm_password').send_keys('weak'); driver.find_element(By.CSS_SELECTOR,'button[type=submit]').click(); wait.until(EC.visibility_of_element_located((By.ID,'signupError'))); shot(err/'2- Weak password test.png')
          go(base+'/signup'); driver.find_element(By.NAME,'full_name').send_keys('Demo Safety User'); driver.find_element(By.NAME,'username').send_keys('demouser'); driver.find_element(By.NAME,'password').send_keys('StrongPass1'); driver.find_element(By.NAME,'confirm_password').send_keys('StrongPass2'); driver.find_element(By.CSS_SELECTOR,'button[type=submit]').click(); wait.until(EC.visibility_of_element_located((By.ID,'signupError'))); shot(err/'3- Password confirmation test.png')
          go(base+'/login'); driver.find_element(By.NAME,'username').send_keys('supervisor'); driver.find_element(By.NAME,'password').send_keys('Safety@2026!'); driver.find_element(By.CSS_SELECTOR,'button[type=submit]').click(); wait.until(lambda d:'/login' not in d.current_url); assert '/login' not in driver.current_url
          for v,n in [('overview','3- Safety dashboard.png'),('monitor','4- Live monitoring screen.png'),('video','5- Video analysis interface.png'),('image','6- Image analysis screen.png'),('zones','7- Restricted zones interface.png'),('incidents','8- Incident review screen.png'),('reports','9- Safety reports interface.png'),('models','10- AI models screen.png')]: go(base+'/?view='+v); assert '/login' not in driver.current_url; shot(inter/n)
          go(base+'/?view=emergency'); r=api('/api/emergency','POST',{'camera':'Main Warehouse Camera'}); assert r['status']==200; card(r['data']['status']+' - '+r['data']['mode'],True); shot(inter/'11- Emergency response interface.png')
          go(base+'/?view=profile'); shot(inter/'12- Supervisor profile.png')
          go(base+'/?view=zones'); r=api('/api/zones','POST',{'camera_id':'Main Warehouse Camera','name':'','zone_type':'RESTRICTED','enabled':True,'points':[[.55,.2],[.95,.2],[.95,.95],[.55,.95]]}); assert r['status']==400; card(r['data']['error']); shot(err/'4- Missing required field test.png')
          go(base+'/?view=zones'); r=api('/api/zones','POST',{'camera_id':'Main Warehouse Camera','name':'Invalid Zone Geometry','zone_type':'RESTRICTED','enabled':True,'points':[[.9,.2],[.9,.4],[.9,.7],[.9,.95]]}); assert r['status']==400; card(r['data']['error']); shot(err/'5- Invalid input test.png')
          go(base+'/?view=video'); r=api('/analyze-video','POST',{},True); assert r['status']==400; card(r['data']['error']); shot(err/'6- Unsupported file test.png')
          driver.quit()
          assert len(list(inter.glob('*.png'))) == 12 and len(list(err.glob('*.png'))) == 6
          hashes={p.name:hashlib.md5(p.read_bytes()).hexdigest() for p in inter.glob('*.png')}; assert len(set(hashes.values()))>=10, hashes
          PY
          python /tmp/capture.py
      - name: Validate files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('screenshots').rglob('*.png')); assert len(files)==18
          for p in files:
              assert '_' not in p.name and '_' not in p.parent.name
              im=Image.open(p); im.verify(); im=Image.open(p); assert im.height<=1000
          print('validated',len(files))
          PY
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: clean-real-browser-screenshots
          path: screenshots
          if-no-files-found: error
