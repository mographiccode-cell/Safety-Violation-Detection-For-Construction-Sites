name: Validate Real Safety Ensemble

on:
  push:
    branches: [main]
    paths:
      - 'ensemble_engine.py'
      - 'incident_store.py'
      - 'app.py'
      - 'templates/**'
      - 'tests/**'
      - 'models/ensemble_config.json'
      - 'ensemble-validation-trigger.txt'
      - '.github/workflows/ensemble-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPERVISOR_USER: supervisor
      SUPERVISOR_PASSWORD: Safety@2026!
      SECRET_KEY: github-actions-validation-key
    steps:
      - uses: actions/checkout@v4

      - name: Mark validation runner started
        run: |
          mkdir -p validation_outputs
          printf '{"runner_started":true,"stage":"checkout"}\n' > validation_outputs/runner_status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation_outputs/runner_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: ensemble validation runner started [skip ci]'
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics flask opencv-python-headless pytest

      - name: Run unit tests
        run: pytest -q tests/test_ensemble_engine.py

      - name: Run real model smoke validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          from ensemble_engine import SafetyEnsembleEngine

          engine = SafetyEnsembleEngine('models/ensemble_config.json')
          out = Path('validation_outputs')
          out.mkdir(exist_ok=True)
          samples = [
              Path('model_test_inputs/v1_worker_machine_crop.jpg'),
              Path('model_test_inputs/v2_worker_crop.jpg'),
              Path('model_test_inputs/v3_worker_machine_crop.jpg'),
          ]
          summary = {'model_status': engine.model_status(), 'samples': {}}
          for i, sample in enumerate(samples):
              frame = cv2.imread(str(sample))
              if frame is None:
                  raise RuntimeError(f'Unable to read {sample}')
              result = engine.analyze_frame(frame, frame_index=i)
              cv2.imwrite(str(out / f'{sample.stem}_ensemble.jpg'), engine.draw_overlay(frame, result))
              payload = {
                  'frame_index': result['frame_index'],
                  'workers': result['workers'],
                  'equipment': result['equipment'],
                  'danger_zones': result['danger_zones'],
                  'incidents': result['incidents'],
              }
              (out / f'{sample.stem}.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
              summary['samples'][sample.name] = {
                  'workers': len(result['workers']),
                  'equipment': len(result['equipment']),
                  'danger_zones': len(result['danger_zones']),
                  'incidents': len(result['incidents']),
                  'worker_severities': [w['severity'] for w in result['workers']],
                  'worker_alerts': [w['alert'] for w in result['workers']],
              }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Validate authenticated Flask supervisor journey
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import app
          client = app.app.test_client()
          results = {}
          results['unauth_redirect'] = client.get('/').status_code in (301, 302)
          login = client.post('/login', data={'username':'supervisor','password':'Safety@2026!'}, follow_redirects=False)
          results['login'] = login.status_code in (301, 302)
          status = client.get('/api/status')
          results['status'] = status.status_code == 200 and status.get_json().get('inference') == 'REAL_TWO_MODEL_ENSEMBLE'
          results['reports'] = client.get('/api/reports/summary').status_code == 200
          emergency = client.post('/api/emergency', json={'camera':'validation-camera'})
          results['emergency'] = emergency.status_code == 200 and emergency.get_json().get('mode') == 'APPLICATION_SIMULATION'
          Path('validation_outputs/api_validation.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          assert all(results.values()), results
          print(results)
          PY

      - name: Mark validation success
        run: |
          printf '{"runner_started":true,"status":"PASS","stage":"complete"}\n' > validation_outputs/runner_status.json

      - name: Commit validation evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f validation_outputs/runner_status.json ]; then
            mkdir -p validation_outputs
            printf '{"runner_started":true,"status":"FAIL","stage":"unknown"}\n' > validation_outputs/runner_status.json
          fi
          git add validation_outputs
          if git diff --cached --quiet; then
            echo 'No validation output changes.'
          else
            git commit -m 'test: real ensemble validation evidence [skip ci]'
            git pull --rebase || true
            git push
          fi
