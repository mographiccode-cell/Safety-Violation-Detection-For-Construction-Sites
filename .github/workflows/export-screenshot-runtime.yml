name: Export Screenshot Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-screenshot-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          printf '{"run_id":%s,"status":"started"}\n' "$GITHUB_RUN_ID" > screenshot-runtime-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshot-runtime-run.json
          git commit -m 'ci: screenshot runtime started [skip ci]'
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable Flask runtime
        run: |
          mkdir -p screenshot-runtime/site-packages
          python -m pip install --target screenshot-runtime/site-packages flask==3.1.3 werkzeug==3.1.8 jinja2==3.1.6 click==8.4.2 itsdangerous==2.2.0 blinker==1.9.0 markupsafe==3.0.3
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-flask-runtime
          path: screenshot-runtime
          if-no-files-found: error
