name: Export Closure Runtime

on:
  push:
    branches: [main]
    paths:
      - 'closure-runtime-trigger.txt'
      - '.github/workflows/export-closure-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish runtime start run id
        run: |
          printf '{"run_id":%s,"run_attempt":%s,"commit":"%s","stage":"started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > closure_runtime_started_run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add closure_runtime_started_run.json
          git commit -m 'ci: closure runtime export started [skip ci]'
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable inference runtime
        run: |
          set -euxo pipefail
          mkdir -p closure_runtime/site-packages closure_runtime/vendor closure_runtime/models
          python -m pip install --upgrade pip
          python -m pip install --target closure_runtime/site-packages --no-deps ultralytics ultralytics-thop
          python -m pip install --target closure_runtime/site-packages polars
          cp ensemble_engine.py action_engine.py track_action_manager.py combined_pipeline.py closure_runtime/
          cp -r vendor/stgcn closure_runtime/vendor/
          cp models/ensemble_config.json closure_runtime/models/
          printf 'PYTHONPATH=%s/site-packages\n' '$CLOSURE_RUNTIME' > closure_runtime/README_RUNTIME.txt
          python - <<'PY'
          import sys
          sys.path.insert(0, 'closure_runtime/site-packages')
          sys.path.insert(0, 'closure_runtime')
          import ultralytics, ensemble_engine, action_engine, track_action_manager, combined_pipeline
          print('portable runtime import OK', ultralytics.__version__)
          PY
      - name: Upload portable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-workplace-safety-closure-runtime
          path: closure_runtime
          retention-days: 1
          compression-level: 6
      - name: Publish runtime completion
        if: always()
        run: |
          printf '{"run_id":%s,"run_attempt":%s,"commit":"%s","stage":"completed"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > closure_runtime_export_run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add closure_runtime_export_run.json
          git commit -m 'ci: closure runtime artifact ready [skip ci]' || true
          git pull --rebase || true
          git push || true
