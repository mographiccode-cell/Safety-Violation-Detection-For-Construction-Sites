name: Dispatch Light Screenshots
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-light-screenshots.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable screenshot workflow on latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mographiccode-cell/Safety-Violation-Detection-For-Construction-Sites/actions/workflows/capture-stable-screenshots.yml/dispatches \
            -d '{"ref":"main"}'
