name: Real Git-Pulled Action Recognition

on:
  push:
    branches: [main]
    paths:
      - 'action-model-pull-trigger.txt'
      - '.github/workflows/find-pull-action-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  action-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mark Action AI runner started
        run: |
          mkdir -p action_validation
          date -u +'%Y-%m-%dT%H:%M:%SZ' > action_validation/runner_started.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add action_validation/runner_started.txt
          git commit -m 'test: Action AI runner started [skip ci]'
          git push

      - name: Git-clone real pose, action weight and source video
        run: |
          set -euxo pipefail
          rm -rf /tmp/action-src /tmp/pose-src
          git clone --depth 1 https://github.com/Bigtuo/YOLOv7-Pose-Bytetrack-STGCN.git /tmp/action-src
          git clone --depth 1 https://github.com/Lamtran213/CameraProject.git /tmp/pose-src
          test -f /tmp/action-src/stgcn/tsstg-model.pth
          test -f /tmp/pose-src/CameraProject/yolov8n-pose.pt
          test -f /tmp/action-src/pose_test1.mp4
          test $(wc -c < /tmp/action-src/stgcn/tsstg-model.pth) -gt 10000000
          test $(wc -c < /tmp/pose-src/CameraProject/yolov8n-pose.pt) -gt 5000000
          test $(wc -c < /tmp/action-src/pose_test1.mp4) -gt 500000
          mkdir -p models/action_candidates vendor/stgcn action_validation
          cp /tmp/action-src/stgcn/tsstg-model.pth models/action_candidates/bigtuo__tsstg-model.pth
          cp /tmp/pose-src/CameraProject/yolov8n-pose.pt models/action_candidates/yolov8n-pose.pt
          cp /tmp/action-src/stgcn/Models.py vendor/stgcn/Models.py
          cp /tmp/action-src/stgcn/Utils.py vendor/stgcn/Utils.py
          cp /tmp/action-src/stgcn/pose_utils.py vendor/stgcn/pose_utils.py
          touch vendor/stgcn/__init__.py
          sha256sum models/action_candidates/bigtuo__tsstg-model.pth models/action_candidates/yolov8n-pose.pt > models/action_candidates/ACTION_SHA256SUMS.txt

      - name: Install inference runtime
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python-headless

      - name: Real 30-frame Pose to TSSTG inference
        run: |
          python - <<'PY'
          import cv2, json, traceback
          from pathlib import Path
          status={'status':'started','source':'Bigtuo/YOLOv7-Pose-Bytetrack-STGCN pose_test1.mp4','frames_requested':30}
          try:
              from action_engine import ActionRecognitionEngine
              engine=ActionRecognitionEngine()
              status['engine_status']=engine.status()
              cap=cv2.VideoCapture('/tmp/action-src/pose_test1.mp4')
              if not cap.isOpened():
                  raise RuntimeError('OpenCV could not open cloned pose_test1.mp4')
              width=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); height=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
              fps=float(cap.get(cv2.CAP_PROP_FPS) or 25.0)
              poses=[]; frame_meta=[]
              for i in range(30):
                  ok,frame=cap.read()
                  if not ok:
                      break
                  det=engine.extract_pose(frame)
                  poses.append(None if det is None else det['keypoints'])
                  frame_meta.append({
                      'frame':i,'pose_detected':det is not None,
                      'person_confidence':0.0 if det is None else det['box_confidence'],
                      'visible_keypoints':0 if det is None else det['visible_keypoints'],
                  })
              cap.release()
              if len(poses)<30:
                  raise RuntimeError(f'Expected 30 source frames, decoded {len(poses)}')
              result=engine.classify_pose_sequence(poses,(width,height))
              coverage=result['pose_coverage']
              payload={
                  'status':'ok','source':'Git-cloned Bigtuo pose_test1.mp4',
                  'frame_count':30,'fps':fps,'image_size':[width,height],
                  'action':result['action'],'confidence':result['confidence'],
                  'probabilities':result['probabilities'],
                  'detected_pose_frames':result['detected_pose_frames'],
                  'pose_coverage':coverage,'frame_meta':frame_meta,
                  'model_status':engine.status(),
                  'quality_gate':coverage>=0.50,
              }
              Path('action_validation/source_test_action.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
              status.update({
                  'status':'ok','action':result['action'],'confidence':result['confidence'],
                  'pose_coverage':coverage,'detected_pose_frames':result['detected_pose_frames'],
                  'quality_gate':coverage>=0.50,
              })
          except Exception as exc:
              status.update({'status':'error','error':f'{type(exc).__name__}: {exc}','traceback':traceback.format_exc()})
          Path('action_validation/action_diagnostic.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          Path('action_validation/summary.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          print(json.dumps(status,indent=2))
          if status.get('status')!='ok' or not status.get('quality_gate'):
              raise SystemExit(2)
          PY

      - name: Preserve original forklift transfer truth
        if: always()
        run: |
          python - <<'PY'
          import json, cv2
          from pathlib import Path
          p='action_test_inputs/v1_entering_forklift_4_10s.mp4'
          cap=cv2.VideoCapture(p); count=0
          while True:
              ok,_=cap.read()
              if not ok: break
              count+=1
          cap.release()
          d={'file':p,'decoded_frames':count,'tsstg_minimum_frames':30,'valid_for_action_test':count>=30,
             'note':'The transferred project clip is not used as Action AI proof when it contains fewer than 30 decoded frames.'}
          Path('action_validation/forklift_transfer_status.json').write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY

      - name: Commit real action evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/action_candidates/yolov8n-pose.pt models/action_candidates/bigtuo__tsstg-model.pth models/action_candidates/ACTION_SHA256SUMS.txt vendor/stgcn action_validation || true
          if git diff --cached --quiet; then
            echo 'No action evidence changes.'
          else
            git commit -m 'test: real TSSTG 30-frame action evidence [skip ci]'
            git pull --rebase || true
            git push
          fi
