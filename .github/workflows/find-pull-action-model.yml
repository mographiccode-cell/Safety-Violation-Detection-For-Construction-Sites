name: Find GitHub Action Recognition Weights

on:
  push:
    branches: [main]
    paths:
      - 'action-model-pull-trigger.txt'
      - '.github/workflows/find-pull-action-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone public action-recognition candidates
        run: |
          set -euxo pipefail
          rm -rf /tmp/action-models && mkdir -p /tmp/action-models
          cd /tmp/action-models
          git clone --depth 1 https://github.com/subha-ilamathy/fall_detection_actions.git subha || true
          git clone --depth 1 https://github.com/Bigtuo/YOLOv7-Pose-Bytetrack-STGCN.git bigtuo || true
          git clone --depth 1 https://github.com/TrNgTinh/Human-Action-Tracking.git trng || true
          git clone --depth 1 https://github.com/AllenCaoo/Fall-Detect-AlphaPose-ST_GCN.git allen || true
          git clone --depth 1 https://github.com/irdanish11/early-fall-detection-multi-stage-lstm.git early || true

      - name: Inventory actual binary weights
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('/tmp/action-models')
          rows = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.pth','.pt','.onnx','.h5','.ckpt'}:
                  continue
              size = p.stat().st_size
              sha = hashlib.sha256(p.read_bytes()).hexdigest() if size < 300_000_000 else 'SKIPPED_LARGE'
              rows.append({'path':str(p.relative_to(root)),'size':size,'sha256':sha})
          rows.sort(key=lambda x:x['size'], reverse=True)
          Path('action_model_inventory.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps(rows,indent=2))
          PY

      - name: Copy lightweight action checkpoint if present
        run: |
          set -euxo pipefail
          mkdir -p models/action_candidates
          # Only copy files whose path/name explicitly indicates action/fall/STGCN/TSSTG,
          # avoiding unrelated YOLO or pose backbones.
          python - <<'PY'
          from pathlib import Path
          import shutil, json
          root=Path('/tmp/action-models')
          out=Path('models/action_candidates')
          copied=[]
          keywords=('action','fall','stgcn','tsstg','lstm')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.pth','.pt','.onnx','.h5','.ckpt'}:
                  continue
              low=str(p).lower()
              if not any(k in low for k in keywords):
                  continue
              size=p.stat().st_size
              if size < 100_000 or size > 100_000_000:
                  continue
              dest=out/(p.parent.parent.name+'__'+p.name)
              shutil.copy2(p,dest)
              copied.append({'file':str(dest),'size':size})
          Path('action_model_copied.json').write_text(json.dumps(copied,indent=2),encoding='utf-8')
          print(copied)
          PY

      - name: Commit discovery evidence and copied candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add action_model_inventory.json action_model_copied.json models/action_candidates || true
          if git diff --cached --quiet; then
            echo 'No action weight found in Git repositories.'
          else
            git commit -m 'models: Git-pulled action-recognition weight inventory [skip ci]'
            git push
          fi
