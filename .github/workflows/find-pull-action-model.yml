name: Real Git-Pulled Action Recognition

on:
  push:
    branches: [main]
    paths:
      - 'action-model-pull-trigger.txt'
      - '.github/workflows/find-pull-action-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  action-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Git-clone pose and TSSTG sources
        run: |
          set -euxo pipefail
          rm -rf /tmp/action-src /tmp/pose-src
          git clone --depth 1 https://github.com/Bigtuo/YOLOv7-Pose-Bytetrack-STGCN.git /tmp/action-src
          git clone --depth 1 https://github.com/Lamtran213/CameraProject.git /tmp/pose-src
          test -f /tmp/action-src/stgcn/tsstg-model.pth
          test -f /tmp/pose-src/CameraProject/yolov8n-pose.pt
          test -f /tmp/action-src/pose_test1.mp4
          test $(wc -c < /tmp/action-src/stgcn/tsstg-model.pth) -gt 10000000
          test $(wc -c < /tmp/pose-src/CameraProject/yolov8n-pose.pt) -gt 5000000
          test $(wc -c < /tmp/action-src/pose_test1.mp4) -gt 500000
          mkdir -p models/action_candidates vendor/stgcn action_validation
          cp /tmp/action-src/stgcn/tsstg-model.pth models/action_candidates/bigtuo__tsstg-model.pth
          cp /tmp/pose-src/CameraProject/yolov8n-pose.pt models/action_candidates/yolov8n-pose.pt
          cp /tmp/action-src/stgcn/Models.py vendor/stgcn/Models.py
          cp /tmp/action-src/stgcn/Utils.py vendor/stgcn/Utils.py
          cp /tmp/action-src/stgcn/pose_utils.py vendor/stgcn/pose_utils.py
          touch vendor/stgcn/__init__.py
          sha256sum models/action_candidates/bigtuo__tsstg-model.pth models/action_candidates/yolov8n-pose.pt > models/action_candidates/ACTION_SHA256SUMS.txt

      - name: Install real action inference runtime
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python-headless

      - name: Verify pose model on project worker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ultralytics import YOLO
          m=YOLO('models/action_candidates/yolov8n-pose.pt')
          r=m.predict('model_test_inputs/v2_worker_crop.jpg',imgsz=640,conf=0.15,verbose=False)[0]
          kp=0 if r.keypoints is None or r.keypoints.data is None else int(r.keypoints.data.shape[0])
          info={'pose_people':0 if r.boxes is None else len(r.boxes),'keypoint_sets':kp,'keypoint_shape':None if kp==0 else list(r.keypoints.data.shape)}
          Path('action_validation/pose_smoke.json').write_text(json.dumps(info,indent=2),encoding='utf-8')
          assert kp > 0, info
          print(info)
          PY

      - name: Create compact real temporal validation clip
        run: |
          set -euxo pipefail
          ffmpeg -y -i /tmp/action-src/pose_test1.mp4 -t 4 -vf "fps=10,scale=640:-2" -an action_validation/source_pose_test_4s.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,width,height,r_frame_rate,duration -of json action_validation/source_pose_test_4s.mp4 > action_validation/source_test_video_info.json
          frames=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 action_validation/source_pose_test_4s.mp4)
          echo "decoded frames=$frames"
          test "$frames" -ge 30

      - name: Run real TSSTG on real source video
        run: |
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          status={'stage':'source_video_action_engine','status':'started'}
          try:
              from action_engine import ActionRecognitionEngine
              engine=ActionRecognitionEngine()
              status['engine_status']=engine.status()
              result=engine.analyze_video('action_validation/source_pose_test_4s.mp4', stride=5)
              Path('action_validation/source_test_action.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
              status.update({
                  'status':'ok','pose_coverage':result['pose_coverage'],
                  'dominant_action':result['dominant_action'],
                  'dominant_confidence':result['dominant_confidence'],
                  'window_count':len(result['windows']),
              })
          except Exception as exc:
              status.update({'status':'error','error':f'{type(exc).__name__}: {exc}','traceback':traceback.format_exc()})
          Path('action_validation/source_action_diagnostic.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY

      - name: Keep original forklift transfer diagnostic separate
        run: |
          python - <<'PY'
          import json, cv2
          from pathlib import Path
          p='action_test_inputs/v1_entering_forklift_4_10s.mp4'
          cap=cv2.VideoCapture(p); count=0
          while True:
              ok,_=cap.read()
              if not ok: break
              count+=1
          cap.release()
          d={'file':p,'decoded_frames':count,'tsstg_minimum_frames':30,'valid_for_action_test':count>=30,
             'note':'Transferred project clip is not used as Action AI proof when below 30 frames.'}
          Path('action_validation/forklift_transfer_status.json').write_text(json.dumps(d,indent=2),encoding='utf-8')
          print(d)
          PY

      - name: Build quality-gated summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          diag=json.loads(Path('action_validation/source_action_diagnostic.json').read_text(encoding='utf-8'))
          summary={'status':diag.get('status'),'quality_gate':False,'validation_video':'Bigtuo pose_test1.mp4 (Git-cloned)'}
          if diag.get('status')=='ok':
              d=json.loads(Path('action_validation/source_test_action.json').read_text(encoding='utf-8'))
              summary.update({
                'frame_count':d['frame_count'],'pose_frames_detected':d['pose_frames_detected'],
                'pose_coverage':d['pose_coverage'],'dominant_action':d['dominant_action'],
                'dominant_confidence':d['dominant_confidence'],'window_count':len(d['windows']),
                'quality_gate':d['pose_coverage']>=0.50 and len(d['windows'])>=1,
                'windows':[{'start_time_s':w['start_time_s'],'end_time_s':w['end_time_s'],
                            'action':w['action'],'confidence':w['confidence'],'pose_coverage':w['pose_coverage']}
                           for w in d['windows']]
              })
          Path('action_validation/summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          if not summary['quality_gate']:
              raise SystemExit(2)
          PY

      - name: Commit real action evidence
        if: always()
        run: |
          rm -f action_validation/source_pose_test_4s.mp4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/action_candidates/yolov8n-pose.pt models/action_candidates/bigtuo__tsstg-model.pth models/action_candidates/ACTION_SHA256SUMS.txt vendor/stgcn action_validation || true
          if git diff --cached --quiet; then
            echo 'No action evidence changes.'
          else
            git commit -m 'test: real TSSTG end-to-end source-video evidence [skip ci]'
            git pull --rebase || true
            git push
          fi
